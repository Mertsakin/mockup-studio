<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.hdr{padding:26px 24px 0}.hdr h1{font-size:30px;letter-spacing:-.6px;font-weight:700}
.chips{display:flex;gap:8px;padding:16px 24px 0;overflow:hidden}
.chips .pill{background:#f0f1f5;color:#4a4f5c;white-space:nowrap}.chips .pill.on{background:#0b0b0f;color:#fff}
.list{padding:18px 24px 0;display:flex;flex-direction:column;gap:14px}
.t{border-radius:20px;overflow:hidden;position:relative;height:150px}
.t:after{content:"";position:absolute;border-radius:8px;background:#0b0b0f;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.t.a:after{left:14%;top:22%;width:72%;height:70%;border-radius:6px 6px 0 0}
.t.b:after{left:38%;top:14%;width:24%;height:100%;border-radius:12px;transform:rotate(-10deg)}
.t.c:after{left:22%;top:26%;width:56%;height:46%}
.t span{position:absolute;left:14px;bottom:12px;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.t em{position:absolute;right:12px;top:12px;font-style:normal;font-size:11px;font-weight:600;background:rgba(255,255,255,.85);color:#0b0b0f;padding:4px 8px;border-radius:999px}
</style></head><body>
