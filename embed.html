<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup</title>
<!-- the embed player (src/embed/player.js): one scene, no editor; runs inside the <mockup-view> iframe -->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  #bg{position:fixed;inset:0}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
  #gl.drag{cursor:grabbing}
  #gl.still{cursor:default}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl" role="img" aria-label="Cihaz mockup'ı"></canvas>
<script type="module" src="/src/embed/player.js"></script>
</body>
</html>
