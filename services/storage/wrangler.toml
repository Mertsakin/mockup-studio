# The storage Worker (docs/uyelik.md §4): R2 behind the user's Supabase session. Local: npm run storage:dev (Miniflare,
# a local R2, .dev.vars for the local Supabase). Deploy: npx wrangler deploy -c services/storage/wrangler.toml. No
# secret: everything, account deletion included, runs with the user's own token (the anon key is public).
name = "shotlight-storage"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "shotlight-projects"
jurisdiction = "eu"

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR-ANON-KEY"
ALLOWED_ORIGINS = "https://shotlight.studio,https://www.shotlight.studio"
